name: Unit Tests

on:
    pull_request:
        types: [opened, reopened, synchronize]
        branches: [ master ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version-file: .node-version
            - run: yarn install --frozen-lockfile
            - run: yarn test
